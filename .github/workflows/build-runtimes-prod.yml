name: Build Runtime Images (Production)

on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - 'src/**'
            - 'Dockerfile*'
            # Re-run when this workflow or related CI changes (paths filter otherwise skips workflow-only edits)
            - '.github/workflows/**'

env:
    PROJECT_ID: charm-cloud-runner-prod
    REGION: us-central1
    REPO_NAME: charm-images

permissions:
    contents: 'read'
    id-token: 'write'

jobs:
    build-runtimes:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            # WIF credentials do not always flow into Docker via `gcloud auth configure-docker`
            # on GH-hosted runners; use OAuth access-token login (recommended pattern for Artifact Registry).
            - id: 'auth'
              name: 'Authenticate to Google Cloud (WIF → access token)'
              uses: 'google-github-actions/auth@v2'
              with:
                  workload_identity_provider: 'projects/684785328850/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
                  service_account: 'github-deployer-prod@charm-cloud-runner-prod.iam.gserviceaccount.com'
                  token_format: access_token

            - name: 'Login to Artifact Registry'
              uses: docker/login-action@v3
              with:
                  registry: '${{ env.REGION }}-docker.pkg.dev'
                  username: 'oauth2accesstoken'
                  password: '${{ steps.auth.outputs.access_token }}'

            - name: "Build & Push Standard Image"
              run: |
                  docker build -f Dockerfile.standard -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/runner-standard:prod .
                  docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/runner-standard:prod

            - name: "Build & Push Full Image"
              run: |
                  docker build -f Dockerfile.full -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/runner-full:prod .
                  docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/runner-full:prod

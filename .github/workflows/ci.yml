name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Run Ruff
        run: ruff check src

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and type dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[runner,dev]"

      - name: Run mypy
        run: mypy src/charm

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[runner,dev]"

      - name: Run pytest
        run: |
          if [ -d tests ]; then
            pytest
          else
            echo "No tests directory yet; keeping required tests gate active."
          fi

  package-build:
    name: package-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build package artifacts
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

  docs-validation:
    name: docs-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docs navigation
        run: |
          python - <<'PY'
          import json
          import pathlib

          root = pathlib.Path("docs")
          config = json.loads((root / "docs.json").read_text(encoding="utf-8"))
          missing = []
          missing_openapi = []
          for tab in config["navigation"]["tabs"]:
              for group in tab.get("groups", []):
                  openapi = group.get("openapi")
                  if openapi:
                      if not (root / openapi).exists():
                          missing_openapi.append(openapi)
                      continue
                  for page in group.get("pages", []):
                      if not (root / f"{page}.mdx").exists():
                          missing.append(page)

          if missing_openapi:
              raise SystemExit(f"Missing OpenAPI specs referenced by docs.json: {missing_openapi}")
          if missing:
              raise SystemExit(f"Missing docs pages referenced by docs.json: {missing}")

          variables = config.get("variables", {})
          navbar = config.get("navbar", {})
          invalid_hrefs = []

          def validate_href(path: str, href: str | None) -> None:
              if not href:
                  invalid_hrefs.append(f"{path}: missing href")
                  return
              if href.startswith("{") and href.endswith("}"):
                  invalid_hrefs.append(
                      f"{path}: {href!r} is a placeholder; navbar hrefs must be literal URLs "
                      "(Mintlify variables only substitute in MDX content, not docs.json schema fields)."
                  )
                  return
              if not (href.startswith("http://") or href.startswith("https://") or href.startswith("/")):
                  invalid_hrefs.append(f"{path}: {href!r} must be http(s):// or a relative path")

          for index, link in enumerate(navbar.get("links", [])):
              validate_href(f"navbar.links[{index}].href", link.get("href"))

          primary = navbar.get("primary")
          if isinstance(primary, dict):
              validate_href("navbar.primary.href", primary.get("href"))

          # Keep navbar store/discord links aligned with docs variables when present.
          store_url = variables.get("store_url")
          discord_url = variables.get("discord_url")
          if isinstance(primary, dict) and store_url and primary.get("href") != store_url:
              invalid_hrefs.append(
                  f"navbar.primary.href drift: expected {store_url!r} from variables.store_url"
              )
          if discord_url and isinstance(navbar.get("links"), list):
              for index, link in enumerate(navbar["links"]):
                  if link.get("label") == "Discord" and link.get("href") != discord_url:
                      invalid_hrefs.append(
                          f"navbar.links[{index}].href drift: expected {discord_url!r} from variables.discord_url"
                      )

          if invalid_hrefs:
              raise SystemExit("Invalid docs.json navbar hrefs:\n" + "\n".join(invalid_hrefs))
          PY

      - name: Check for placeholder TODOs
        run: |
          python - <<'PY'
          import pathlib

          offenders = []
          for path in pathlib.Path("docs").rglob("*.mdx"):
              if "TODO:" in path.read_text(encoding="utf-8"):
                  offenders.append(str(path))

          if offenders:
              raise SystemExit(f"Found TODO placeholders in docs: {offenders}")
          PY

  build-validation:
    name: build-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build base runtime image
        run: docker build -f docker/Dockerfile.base -t charm-runner-base:ci -t ucmind/charm-base:latest .

      - name: Build langchain runtime image
        run: docker build -f docker/Dockerfile.langchain -t charm-runner-langchain:ci .

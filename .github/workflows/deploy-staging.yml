name: Build Runtime Images (Staging)

on:
  push:
    branches:
      - develop
    paths:
      - 'src/**'
      - 'Dockerfile*'

env:
  PROJECT_ID: charm-cloud-runner
  REGION: us-central1
  REPO_NAME: charm-images

jobs:
  build-runtimes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: "auth"
        uses: "google-github-actions/auth@v2"
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"

      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@v2"

      - name: "Configure Docker"
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: "Build & Push Base Image"
        run: |
          docker build -f Dockerfile.base -t ucmind/charm-base:latest .
          docker tag ucmind/charm-base:latest ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/runner-base:staging
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/runner-base:staging

      - name: "Build & Push LangChain Image"
        run: |
          docker build -f Dockerfile.langchain -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/runner-langchain:staging .
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/runner-langchain:staging

      - name: "Build & Push CrewAI Image"
        run: |
          docker build -f Dockerfile.crewai -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/runner-crewai:staging .
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/runner-crewai:staging

      - name: "Build & Push OpenClaw Image"
        run: |
          docker build -f Dockerfile.openclaw -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/runner-openclaw:staging .
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/runner-openclaw:staging

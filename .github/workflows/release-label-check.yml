name: Release Label Check

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  release-label:
    name: release-label
    runs-on: ubuntu-latest
    steps:
      - name: Require one release category label
        uses: actions/github-script@v7
        with:
          script: |
            const categoryLabels = new Set([
              "release:feature",
              "release:fix",
              "release:breaking",
              "release:security",
              "release:infra",
              "release:docs",
              "release:chore",
              "release:skip",
            ]);

            const { owner, repo } = context.repo;
            const existingLabels = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner,
              repo,
              per_page: 100,
            });
            const existingCategoryLabels = existingLabels
              .map((label) => label.name)
              .filter((label) => categoryLabels.has(label));

            if (existingCategoryLabels.length === 0) {
              core.warning(
                "No release category labels exist in this repository yet. " +
                "Skipping enforcement until Sync Release Labels has bootstrapped them."
              );
              return;
            }

            const labels = context.payload.pull_request.labels.map((label) => label.name);
            const matched = labels.filter((label) => categoryLabels.has(label));

            if (matched.length !== 1) {
              core.setFailed(
                `Expected exactly one release category label, found ${matched.length}: ${matched.join(", ") || "none"}. ` +
                `Use one of: ${Array.from(categoryLabels).join(", ")}.`
              );
            }

version: "0.4.1" # [System] UAC Protocol Version

# 1. Metadata
persona:
  name: "My Charm Agent"
  version: "0.1.0" # Semantic Versioning (e.g. 0.1.0, 1.2.0)
  description: "A short description of what this agent does."
  full_description: |
    # My Charm Agent
    Write a detailed markdown description here.
    Explain capabilities, inputs, and what to expect.
  authors: ["Your Name"]
  tags: ["productivity"] # First tag determines category
  license: "MIT"

  # Storefront Assets
  # assets:
  #   icon: "https://.../icon.png"
  #   banner: "https://.../banner.jpg"

# 2. Pricing
pricing:
  type: "free"

# 3. Interface (UI Definition)
interface:
  input:
    type: "object"
    required: ["task"]
    properties:
      task:
        type: "string"
        title: "Task Input"
        description: "What should the agent input?"
        x-ui-widget: "textarea"

      # File Upload Configuration
      # Uncomment and rename the variable below if your agent needs to read files.
      # The platform will automatically inject the uploaded filename into this variable.
      # doc_file:
      #   type: "string"
      #   title: "Upload Document"
      #   description: "Upload a PDF or Image."
      #   x-ui-widget: "file"

  output:
    type: "object"
    description: "The agent's result."

# 4. Runtime Configuration
runtime:
  adapter:
    # - crewai / langchain / langgraph : Standard Python Frameworks
    # - openclaw : Configuration-driven Agent (No code required)
    # - node : For JavaScript/TypeScript Agents
    # - custom : Pure Python functions
    type: "crewai"

    # [Entry Point] Where does execution start?
    # - Python: "module:variable" (e.g. "src.main:agent")
    # - Node.js: "shell command"  (e.g. "npm start")
    # - OpenClaw: Optional (uses default host if empty)
    entry_point: "src.main:agent"

    # List required environment variable NAMES (keys only, no values)
    environment_variables:
      - "OPENAI_API_KEY"

    # [Environment Mode]
    # "standard": Lightweight Python env. Best for text/data tasks.
    # "full": Includes Node.js, Chrome, FFmpeg. REQUIRED for MCP Skills, Browser Use, or OpenClaw.
    mode: "standard"

    # [Execution Mode]
    # "serverless": Max 10 mins. Ideal for single tasks.
    # "daemon": 24/7 Always-on. Ideal for monitoring or long-running services.
    lifecycle: "serverless"

    # [AgentSkills & MCP Tools]
    # Usage in Code: You are responsible for connecting to them (e.g. using LangChain adapters).
    # skills:
    #   - name: "my-skill"
    #     source: "./skills/my-skill"
    #   - name: "google-search"
    #     source: "smithery:@mcp/google-search"
    #   - name: "time-server"
    #     source: "pypi:mcp-server-time"

# 5. Authentication Requirements
# Declare if your agent needs user's OAuth tokens.
auth:
  providers:
    - name: "google"
      scopes:
        - "https://www.googleapis.com/auth/calendar.readonly"
        - "https://www.googleapis.com/auth/gmail.send"

# 6. Governance
policies:
  allow_internet_access: true
  max_steps: 20
  # Optional: Override serverless run timeout for this agent (seconds).
  # execution_timeout_seconds: 600

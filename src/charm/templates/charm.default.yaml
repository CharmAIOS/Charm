version: "0.4.1"  # [System] UAC Protocol Version

# 1. Metadata
persona:
  name: "My Charm Agent"
  
  # [Required] Semantic version of the agent
  version: "0.1.0"
  
  description: "A short description of what this agent does."
  full_description: |
    # My Charm Agent
    Describe your agent's capabilities and usage here.
  authors: ["Your Name"]
  tags: ["agent"]
  license: "MIT"
  
  # Storefront Assets
  # assets:
  #   icon: "https://.../icon.png"
  #   banner: "https://.../banner.jpg"

# 2. Pricing
pricing:
  type: "free"

# 3. Interface (UI Definition)
interface:
  input:
    type: "object"
    required: ["task"]
    properties:
      task:
        type: "string"
        title: "Task Input"
        description: "What should the agent input?"
        x-ui-widget: "textarea"
      
      # [Optional] File Upload Configuration
      # Uncomment and rename the variable below if your agent needs to read files.
      # The platform will automatically inject the uploaded filename into this variable.
      # doc_file:
      #   type: "string"
      #   title: "Upload Document"
      #   description: "Upload a PDF or Image."
      #   x-ui-widget: "file"

  output:
    type: "object"
    description: "The agent's result."

# 4. Runtime Configuration
runtime:
  adapter:
    # Options: crewai, langchain, langgraph, custom, node, openclaw
    type: "crewai"  
    
    # Execution Entry Point:
    # - Python: "module:variable" (e.g. "src.main:agent")
    # - Node.js: "shell command"  (e.g. "npm start")
    # - OpenClaw: Optional (uses default host if empty)
    entry_point: "src.main:agent"
    
    # List required environment variable NAMES (keys only, no values)
    environment_variables:
      - "OPENAI_API_KEY"
    
    # [Optional] MCP Skills Configuration (For type='openclaw')
    # Uncomment and add your skill definitions below.
    # skills:
    #   - name: "my-skill"
    #     source: "./skills/my-skill"
    #   - name: "google-search"
    #     source: "smithery:@mcp/google-search"

  # "standard" (Default): Lightweight Python env. Best for text/data tasks.
  # "full": Heavy env with Chrome, Node.js, and OpenClaw support.
  mode: "standard"

  injections:
    llm_client: true
    tools: []

# 5. [New] Authentication Requirements
# Declare if your agent needs user's OAuth tokens.
# auth:
#   providers:
#     - name: "google"
#       scopes: ["calendar.readonly"]
#     - name: "github"
#       scopes: ["repo"]

# 6. Governance
policies:
  allow_internet_access: true
  max_steps: 20